# Source Files
source =~/.config/mango/bind.conf

env = GDK_BACKEND,wayland,x11,*
#Execs

exec-once =  swww-daemon 
exec-once = quickshell --config bar

exec-once = wl-paste --type text --watch cliphist store

exec-once = pipewire
exec-once = dunst
#exec-once = pipewire-pulse
#exec-once = wireplumber


exec-once = /usr/libexec/xdg-desktop-portal-wlr
exec-once = /usr/libexec/xdg-desktop-portal

#Monitors
monitorrule=name:eDP-1,width:1920,height:1080,refresh:144,scale:1,x:0,y:0
#monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:144,scale:1,x:0,y:0
#monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:144,x:1920,y:0 
monitorrule=name:HDMI-A-1,width:1280,height:960,refresh:60,x:0,y:1080

allow_tearing=0
animations=0
gappih=5
gappiv=5
gappoh=5
gappov=5
borderpx=4
no_border_when_single=0
focuscolor=0x005577ff

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# options
repeat_rate=35
repeat_delay=200

# Effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 3
blur_params_noise = 0.0
blur_params_brightness = 0.95
blur_params_contrast = 0.95
blur_params_saturation = 1.0

shadows = 0
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide 
layer_animation_type_open=slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=100
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=5
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=0
scroller_prefer_overspread=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.95,0.5

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.5
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppyfocus=1
warpcursor=0
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1



# Appearance
gappih=2
gappiv=2
gappoh=2
gappov=2
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
#rootcolor=0x201b14ff
bordercolor=0x0a422eff
focuscolor=0x09563bff
#maximizescreencolor=0x89aa61ff
#urgentcolor=0xad401fff
#scratchpadcolor=0x516c93ff
#globalcolor=0xb153a7ff
#overlaycolor=0xe7c582ff


# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:vertical_scroller
tagrule=id:2,layout_name:vertical_scroller
tagrule=id:3,layout_name:vertical_scroller
tagrule=id:4,layout_name:deck
tagrule=id:5,layout_name:fair
tagrule=id:6,layout_name:fair
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
bind=SUPER,0,toggleoverview


# Use a single GPU
#WLR_DRM_DEVICES=/dev/dri/card1 mango

# Use multiple GPUs
WLR_DRM_DEVICES=/dev/dri/card0:/dev/dri/card1 mango


#Windowrules
windowrule=appid:ghostty,isfloating:1,width:1450,height:850
windowrule=title:imv,isfloating:1,width:800,height:800
windowrule=title:mpv,isfloating:1,width:800,height:800
