#############################################
#                 PICOM v13                 #
#              MAXIMUM SLICKNESS             #
#############################################

#############################################
# BACKEND
#############################################

backend = "glx";

vsync = true;
use-damage = true;

# Keep fullscreen windows composited.
# Change to true if you want maximum battery savings.
unredir-if-possible = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

use-ewmh-active-win = true;


#############################################
#                 FADING
#############################################

fading = true;

fade-in-step = 0.015;
fade-out-step = 0.015;
fade-delta = 6;
fade-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'"
];


#############################################
#                SHADOWS
#############################################

shadow = true;

shadow-radius = 20;
shadow-opacity = 0.65;

shadow-offset-x = -8;
shadow-offset-y = -8;

# Makes shadows feel more like a soft glow
shadow-color = "#000000";

shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'notification'",
    "class_g = 'i3-frame'",

    # Firefox
    "class_g = 'firefox' && argb",
    "class_g = 'Firefox' && argb",

    # Telegram
    "class_g = 'TelegramDesktop' && argb",

    # Thunderbird
    "class_g = 'thunderbird' && argb"
];


#############################################
#             ROUNDED CORNERS
#############################################

corner-radius = 8;

rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'notification'"
];


#############################################
#                 OPACITY
#############################################

active-opacity = 1.0;
inactive-opacity = 1.0;

inactive-opacity-override = false;

focus-exclude = [];


#############################################
#                   BLUR
#############################################

# FANCY MODE
blur-background = true;
blur-background-fixed = true;

# Strong blur
blur-strength = 8;

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",

    # Don't blur these
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",

    # Don't blur fullscreen/video content
    "class_g = 'mpv'",
    "class_g = 'vlc'"
];





#############################################
#              WINDOW TYPES
#############################################

wintypes:
{
    #########################################
    # TOOLTIP
    #########################################

    tooltip = {
        fade = true;
        shadow = true;
        opacity = 0.90;
        focus = true;
        full-shadow = false;
    };


    #########################################
    # DOCK / WIBAR
    #########################################

    dock = {
        shadow = false;
        clip-shadow-above = true;
        fade = false;
    };


    #########################################
    # DRAG & DROP
    #########################################

    dnd = {
        shadow = false;
        fade = true;
    };


    #########################################
    # POPUP MENUS
    #########################################

    popup_menu = {
        opacity = 0.92;
        shadow = true;
        fade = true;
        focus = true;
    };


    #########################################
    # DROPDOWN MENUS
    #########################################

    dropdown_menu = {
        opacity = 0.92;
        shadow = true;
        fade = true;
        focus = true;
    };


    #########################################
    # NORMAL WINDOWS
    #########################################

    normal = {
        fade = true;
        shadow = true;
        opacity = 1.0;
    };
};


#############################################
#             EXTRA EFFECTS
#############################################

# Fading when windows become inactive
inactive-opacity = 1.0;

# Don't invert anything
invert-color-include = [];


#############################################
#              WM DETECTION
#############################################

detect-client-leader = true;
detect-transient = true;

# Useful for AwesomeWM
use-ewmh-active-win = true;
