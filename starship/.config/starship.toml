
# ═══════════════════════════════════════════════
# STARSHIP — MONOCORE / SECTION 9
# ═══════════════════════════════════════════════

add_newline = true
palette = "monocore"

format = """
[░▒▓](fg:deep)\
$directory\
$fill\
$time\
$username
$character"""

command_timeout = 500
scan_timeout = 10
follow_symlinks = false

# ───────────────────────────────────────────────
# PALETTE
# ───────────────────────────────────────────────

[palettes.monocore]
background = "#080808"
foreground = "#d0d0d0"

primary = "#f0f0f0"
secondary = "#a8a8a8"
tertiary = "#707070"

surface = "#161616"
surface2 = "#202020"

line = "#303030"
highlight = "#ffffff"

muted = "#606060"
deep = "#101010"

# ───────────────────────────────────────────────
# DIRECTORY
# ───────────────────────────────────────────────

[directory]
disabled = false
home_symbol = "󰋜 ~"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " "

format = "[ ](fg:tertiary)[  ](fg:background bg:tertiary)[](fg:tertiary bg:surface2)[  $path  ](fg:foreground bg:surface2)[$read_only](fg:muted bg:surface2)[](fg:surface2)"

# ───────────────────────────────────────────────
# SPACER
# ───────────────────────────────────────────────

[fill]
symbol = "─"
style = "fg:line"

# ───────────────────────────────────────────────
# TIME
# ───────────────────────────────────────────────

[time]
disabled = false
time_format = "%H:%M"

format = "[](fg:secondary)[ 󱑍 ](fg:background bg:secondary)[](fg:secondary bg:surface)[  $time  ](fg:foreground bg:surface)[](fg:surface)"

# ───────────────────────────────────────────────
# USER
# ───────────────────────────────────────────────

[username]
disabled = false
show_always = true

format = "[](fg:tertiary)[ 󰀄 ](fg:background bg:tertiary)[](fg:tertiary bg:surface2)[  $user  ](fg:foreground bg:surface2)[](fg:surface2)"

# ───────────────────────────────────────────────
# PROMPT
# ───────────────────────────────────────────────

[character]
success_symbol = "[╰─▶](fg:#d0d0d0)"
error_symbol = "[╰─▶](fg:#8a4444)"
vimcmd_symbol = "[╰─◀](fg:#a8a8a8)"

format = """ 
$symbol 
"""
